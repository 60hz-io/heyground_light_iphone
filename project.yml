name: HeygroundQR
options:
  bundleIdPrefix: io.60hz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # 팀 ID 는 Xcode 에서 서명 팀을 고르면 채워진다. 여기 비워두어야 클론 직후에도 열린다.
    DEVELOPMENT_TEAM: ""

targets:
  HeygroundQR:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.60hz.heygroundqr
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 헤이그라운드 QR
        UIStatusBarStyle: UIStatusBarStyleLightContent
        # 지오펜스로 회사 도착을 감지해 미리 토큰·QR 을 받아두려면 '항상 허용'이 필요하다.
        NSLocationWhenInUseUsageDescription: 회사에 도착하면 출입 QR을 미리 준비해두기 위해 위치를 사용합니다.
        NSLocationAlwaysAndWhenInUseUsageDescription: 앱이 닫혀 있어도 회사 도착을 감지해 출입 QR을 미리 준비해두기 위해 '항상 허용'이 필요합니다.
    entitlements:
      path: App/HeygroundQR.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.60hz.heygroundqr
        keychain-access-groups:
          - $(AppIdentifierPrefix)io.60hz.heygroundqr
    dependencies:
      - target: HeygroundQRWidget

  HeygroundQRWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.60hz.heygroundqr.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 출입 QR
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/HeygroundQRWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.60hz.heygroundqr
        keychain-access-groups:
          - $(AppIdentifierPrefix)io.60hz.heygroundqr
